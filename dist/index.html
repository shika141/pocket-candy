utton class="close" data-close="book">×</button></div><div id="bookBody" class="book-body"></div></dialog><dialog id="guide"><div class="dialog-head"><h2>糖糖的糖果分類表</h2><button class="close" data-close="guide">×</button></div><div id="classification" class="classification"></div></dialog>

const $=s=>document.querySelector(s),today=()=>new Date().toLocaleDateString('sv-SE'),key='tangtang-daily-v2',bookKey='tangtang-wrapper-book-v2';let current=null;function safeGet(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function weightedCandy(){if(Math.random()<.04)return candies.find(c=>c.special);const p=candies.filter(c=>!c.special);return p[Math.floor(Math.random()*p.length)]}function createResult(){const c=weightedCandy();return{date:today(),candyId:c.id,slip:Math.floor(Math.random()*10),milk:false}}

<script>
(()=>{const candyImages={strawberry:'assets/candy/strawberry.webp',lemon:'assets/candy/lemon.webp',grape:'assets/candy/grape.webp',milk:'assets/candy/milk.webp',peach:'assets/candy/peach.webp',mint:'assets/candy/mint.webp',caramel:'assets/candy/caramel.webp',chocolate:'assets/candy/chocolate.webp',lollipop:'assets/candy/lollipop.webp'};const originalRender=render;render=function(result,animate=false){originalRender(result,animate);const candy=candies.find(item=>item.id===result.candyId);if(!candy)return;const src=candyImages[candy.id];document.querySelector('#resultIcon').innerHTML=`<img src="${src}" alt="糖糖抱著${candy.name}的Q版插畫">`;if(animate)document.querySelector('#wrapCandy').innerHTML=`<img src="${src}" alt="正在抽出${candy.name}">`};if(current)render(current,false)})();

<script>
(()=>{const wrapperImages={strawberry:'assets/wrappers/strawberry.webp',lemon:'assets/wrappers/lemon.webp',grape:'assets/wrappers/grape.webp',milk:'assets/wrappers/milk.webp',peach:'assets/wrappers/peach.webp',mint:'assets/wrappers/mint.webp',caramel:'assets/wrappers/caramel.webp',chocolate:'assets/wrappers/chocolate.webp',lollipop:'assets/wrappers/lollipop.webp'},candyImages={strawberry:'assets/candy/strawberry.webp',lemon:'assets/candy/lemon.webp',grape:'assets/candy/grape.webp',milk:'assets/candy/milk.webp',peach:'assets/candy/peach.webp',mint:'assets/candy/mint.webp',caramel:'assets/candy/caramel.webp',chocolate:'assets/candy/chocolate.webp',lollipop:'assets/candy/lollipop.webp'};const detail=document.createElement('dialog');detail.id='wrapperDetail';detail.innerHTML='<div class="dialog-head"><h2>這一天抽到的糖</h2><button class="close" type="button" aria-label="關閉糖紙詳情">×</button></div><div id="wrapperDetailBody" class="detail-body"></div>';document.body.appendChild(detail);detail.querySelector('.close').addEventListener('click',()=>detail.close());detail.addEventListener('click',event=>{if(event.target===detail)detail.close()});function showDetail(index){const r=getBook()[index],c=r&&candies.find(item=>item.id===r.candyId);if(!r||!c)return;const s=c.slips[r.slip]||c.slips[0],stars='★'.repeat(c.rating)+'☆'.repeat(Math.max(0,5-c.rating));detail.style.setProperty('--detail-accent',c.color);document.querySelector('#wrapperDetailBody').innerHTML=`<div class="detail-date">${r.date}</div><section class="detail-hero"><img class="detail-candy-art" src="${candyImages[c.id]}" alt="糖糖抱著${c.name}的Q版插畫"><h3>${c.name}</h3><div><span class="detail-effect">今日糖運・${c.effect}</span>　<span class="stars">${stars}</span></div></section><section class="detail-section"><span class="label">今日糖籤・${String(r.slip+1).padStart(2,'0')}</span><h4>${s[0]}</h4><p class="detail-tang">${s[1]}</p></section><section class="detail-section"><span class="label">今日小行動</span><p>${s[2]} ${c.advice}</p></section>${r.milk?'<div class="detail-gift"><strong>糖糖又塞了一顆給你・🍬 牛奶糖</strong><br>「這個不是占卜。」<br>「今天辛苦的話就吃掉。」</div>':''}<section class="detail-wrapper"><strong>這一天收進糖紙冊的糖紙</strong><img src="${wrapperImages[c.id]}" alt="${c.name}糖紙圖案"></section>`;detail.showModal()}showBook=function(){const b=getBook();document.querySelector('#bookBody').innerHTML=b.length?`<div class="book-grid">${b.map((r,index)=>{const c=candies.find(x=>x.id===r.candyId),s=c.slips[r.slip],src=wrapperImages[c.id];return`<button class="saved saved-card" type="button" data-wrapper-index="${index}" aria-label="查看 ${r.date} ${c.name}的抽選內容"><div class="saved-top"><span class="saved-icon"><img src="${src}" alt="${c.name}糖紙圖案"></span><span class="saved-date">${r.date}</span></div><h3>${c.name}・${String(r.slip+1).padStart(2,'0')}</h3><p>${s[0]}</p></button>`}).join('')}</div>`:'<div class="book-empty">還沒有糖紙。<br>抽到今日的糖以後，把它收進來吧。</div>';document.querySelector('#book').showModal()};document.querySelector('#bookBody').addEventListener('click',event=>{const card=event.target.closest('[data-wrapper-index]');if(card)showDetail(Number(card.dataset.wrapperIndex))})})();
</script>

<script>
